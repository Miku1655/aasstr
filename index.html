<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Private Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0a0b;
    --bg2: #131013;
    --bg3: #1a161a;
    --border: #2e2530;
    --accent: #9b2335;
    --accent2: #c4516a;
    --accent3: #e8909f;
    --gold: #c4a265;
    --gold2: #e8c98a;
    --text: #e2d8d0;
    --text2: #b5a89e;
    --text3: #7a6e68;
    --reading-bg: #f7f0e8;
    --reading-text: #1c1715;
    --reading-text2: #4a3f39;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 17px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ── Header ── */
  #header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(12,10,11,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; gap: 2rem;
    height: 58px;
  }
  #logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: var(--gold);
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #logo span { color: var(--accent2); }
  #header-search {
    flex: 1; max-width: 400px;
    display: flex; align-items: center; gap: 0.5rem;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0.35rem 0.75rem;
  }
  #header-search svg { opacity: 0.4; flex-shrink: 0; }
  #search-input {
    background: none; border: none; outline: none;
    color: var(--text); font-family: 'EB Garamond', serif;
    font-size: 0.95rem; width: 100%;
  }
  #search-input::placeholder { color: var(--text3); }
  #header-actions { margin-left: auto; display: flex; gap: 0.75rem; }
  .hbtn {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 0.4rem 1rem; cursor: pointer;
    border-radius: 1px; transition: all 0.2s;
  }
  .hbtn-ghost {
    background: none; border: 1px solid var(--border); color: var(--text2);
  }
  .hbtn-ghost:hover { border-color: var(--accent2); color: var(--accent2); }
  .hbtn-solid {
    background: var(--accent); border: 1px solid var(--accent); color: #fff;
  }
  .hbtn-solid:hover { background: var(--accent2); border-color: var(--accent2); }

  /* ── Main wrapper ── */
  #main { flex: 1; display: flex; }

  /* ── Sidebar ── */
  #sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    padding: 1.5rem 0;
    position: sticky; top: 58px;
    height: calc(100vh - 58px);
    overflow-y: auto;
  }
  .sidebar-section { margin-bottom: 1.75rem; }
  .sidebar-label {
    font-family: 'Inconsolata', monospace;
    font-size: 0.65rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--text3);
    padding: 0 1.25rem; margin-bottom: 0.5rem;
  }
  .sidebar-item {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.45rem 1.25rem; cursor: pointer;
    font-family: 'EB Garamond', serif; font-size: 0.95rem;
    color: var(--text2); transition: all 0.15s;
    border-left: 2px solid transparent;
  }
  .sidebar-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .sidebar-item.active { color: var(--accent3); border-left-color: var(--accent2); background: rgba(155,35,53,0.08); }
  .sidebar-count {
    margin-left: auto;
    font-family: 'Inconsolata', monospace;
    font-size: 0.7rem; color: var(--text3);
    background: var(--bg3); border-radius: 8px;
    padding: 1px 6px;
  }
  .sidebar-divider { height: 1px; background: var(--border); margin: 0.5rem 1.25rem 1rem; }

  /* ── Content area ── */
  #content { flex: 1; padding: 2rem 2.5rem; max-width: 1100px; }

  /* ── Library view ── */
  #view-library {}
  .library-header {
    display: flex; align-items: baseline; gap: 1rem;
    margin-bottom: 1.5rem; border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
  }
  .library-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.7rem; font-weight: 300;
    color: var(--gold);
  }
  .library-subtitle { color: var(--text3); font-size: 0.9rem; margin-left: auto; }

  /* Toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 1.5rem; flex-wrap: wrap;
  }
  .sort-select {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text2); padding: 0.35rem 0.6rem;
    font-family: 'EB Garamond', serif; font-size: 0.9rem;
    border-radius: 2px; outline: none; cursor: pointer;
  }
  .sort-select:focus { border-color: var(--accent); }
  .filter-tag {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-family: 'Inconsolata', monospace;
    font-size: 0.72rem; letter-spacing: 0.05em;
    padding: 0.25rem 0.6rem; border-radius: 1px;
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text3); cursor: pointer; transition: all 0.15s;
  }
  .filter-tag:hover { border-color: var(--accent2); color: var(--accent3); }
  .filter-tag.active { background: rgba(155,35,53,0.15); border-color: var(--accent); color: var(--accent3); }
  .filter-tag .remove { opacity: 0.5; }
  .filter-tag .remove:hover { opacity: 1; }

  /* Story grid */
  .story-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
  }
  .story-card {
    background: var(--bg2);
    padding: 1.25rem 1.5rem;
    cursor: pointer; transition: background 0.15s;
    position: relative;
    overflow: hidden;
  }
  .story-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 2px; background: var(--accent);
    transform: scaleY(0); transform-origin: bottom;
    transition: transform 0.2s ease;
  }
  .story-card:hover { background: var(--bg3); }
  .story-card:hover::before { transform: scaleY(1); }
  .card-category {
    font-family: 'Inconsolata', monospace;
    font-size: 0.65rem; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--accent2);
    margin-bottom: 0.5rem;
  }
  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem; font-weight: 500;
    color: var(--text); margin-bottom: 0.3rem;
    line-height: 1.3;
  }
  .card-author {
    font-size: 0.85rem; color: var(--text3);
    margin-bottom: 0.6rem; font-style: italic;
  }
  .card-summary {
    font-size: 0.88rem; color: var(--text2);
    line-height: 1.5; margin-bottom: 0.75rem;
    display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-footer {
    display: flex; align-items: center; gap: 0.75rem;
    font-family: 'Inconsolata', monospace;
    font-size: 0.7rem; color: var(--text3);
  }
  .card-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .card-tag {
    background: rgba(155,35,53,0.12); border: 1px solid rgba(155,35,53,0.25);
    color: var(--accent3); padding: 1px 5px; border-radius: 1px;
    font-family: 'Inconsolata', monospace; font-size: 0.65rem;
    letter-spacing: 0.05em;
  }
  .card-fav {
    margin-left: auto; cursor: pointer; opacity: 0.4;
    font-size: 1rem; transition: all 0.15s; color: var(--gold);
    background: none; border: none;
  }
  .card-fav:hover, .card-fav.active { opacity: 1; }
  .card-wc { color: var(--text3); }

  /* Progress bar on card */
  .card-progress {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 2px; background: var(--border);
  }
  .card-progress-fill {
    height: 100%; background: var(--accent2);
    transition: width 0.3s;
  }

  /* Empty state */
  .empty-state {
    text-align: center; padding: 5rem 2rem;
    color: var(--text3);
  }
  .empty-state svg { opacity: 0.2; margin-bottom: 1.5rem; }
  .empty-state h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem; font-weight: 300;
    color: var(--text2); margin-bottom: 0.5rem;
  }

  /* ── Reader view ── */
  #view-reader { display: none; }
  .reader-nav {
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: 2rem; padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-family: 'Inconsolata', monospace; font-size: 0.75rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text3); cursor: pointer; background: none; border: none;
    transition: color 0.15s;
  }
  .back-btn:hover { color: var(--accent3); }
  .reader-actions { margin-left: auto; display: flex; gap: 0.75rem; }

  .reader-header { margin-bottom: 3rem; }
  .reader-category {
    font-family: 'Inconsolata', monospace;
    font-size: 0.7rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--accent2);
    margin-bottom: 1rem;
  }
  .reader-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 300; line-height: 1.15;
    color: var(--gold); margin-bottom: 0.75rem;
  }
  .reader-author {
    font-size: 1rem; color: var(--text2); font-style: italic;
    margin-bottom: 1.5rem;
  }
  .reader-meta {
    display: flex; gap: 1.5rem; align-items: center;
    font-family: 'Inconsolata', monospace;
    font-size: 0.72rem; color: var(--text3);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 0.6rem 0; margin-bottom: 1.5rem;
  }
  .reader-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }

  /* Font size controls */
  .reader-font-controls {
    display: flex; align-items: center; gap: 0.5rem;
    font-family: 'Inconsolata', monospace; font-size: 0.75rem;
    color: var(--text3);
  }
  .font-btn {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text2); width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 1px; font-size: 0.85rem;
    transition: all 0.15s;
  }
  .font-btn:hover { border-color: var(--accent); color: var(--accent3); }

  /* Light/dark toggle for reader */
  .mode-toggle {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text2); padding: 0.25rem 0.6rem;
    font-family: 'Inconsolata', monospace; font-size: 0.72rem;
    letter-spacing: 0.1em; cursor: pointer; border-radius: 1px;
    transition: all 0.15s;
  }
  .mode-toggle:hover { border-color: var(--accent); color: var(--accent3); }

  /* Story body */
  .reader-body-wrapper {
    max-width: 680px;
    transition: background 0.3s, color 0.3s;
  }
  .reader-body-wrapper.light-mode {
    background: var(--reading-bg);
    color: var(--reading-text);
    padding: 2.5rem 3rem;
    border: 1px solid #d5c8bc;
  }
  .reader-body {
    font-family: 'EB Garamond', Georgia, serif;
    line-height: 1.85;
    color: inherit;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .reader-body-wrapper.light-mode .reader-body {
    color: var(--reading-text);
  }
  .reader-font-s1 .reader-body { font-size: 0.95rem; }
  .reader-font-s2 .reader-body { font-size: 1.05rem; }
  .reader-font-s3 .reader-body { font-size: 1.15rem; }
  .reader-font-s4 .reader-body { font-size: 1.25rem; }
  .reader-font-s5 .reader-body { font-size: 1.4rem; }

  /* ── Editor view ── */
  #view-editor { display: none; }
  .editor-header {
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: 2rem;
  }
  .editor-title-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.7rem; font-weight: 300; color: var(--gold);
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
  .form-group.full { grid-column: 1 / -1; }
  .form-label {
    font-family: 'Inconsolata', monospace;
    font-size: 0.68rem; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--text3);
  }
  .form-input, .form-select, .form-textarea {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); padding: 0.55rem 0.75rem;
    font-family: 'EB Garamond', serif; font-size: 1rem;
    border-radius: 1px; outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent);
  }
  .form-select { cursor: pointer; }
  .form-textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
  #content-textarea {
    min-height: 500px;
    font-family: 'EB Garamond', serif;
    font-size: 1.05rem; line-height: 1.8;
  }
  .form-hint { font-size: 0.8rem; color: var(--text3); font-style: italic; }
  .form-actions {
    display: flex; gap: 1rem; margin-top: 1.5rem;
    padding-top: 1.5rem; border-top: 1px solid var(--border);
  }
  .btn {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 0.6rem 1.5rem;
    cursor: pointer; border-radius: 1px; transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); border: 1px solid var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }
  .btn-secondary { background: none; border: 1px solid var(--border); color: var(--text2); }
  .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn-danger { background: none; border: 1px solid #5a1a22; color: #c46a7a; }
  .btn-danger:hover { background: rgba(90,26,34,0.3); }

  /* ── Tag cloud view ── */
  #view-tags { display: none; }
  .tag-cloud {
    display: flex; flex-wrap: wrap; gap: 0.75rem;
    padding: 1.5rem 0;
  }
  .tag-cloud-item {
    cursor: pointer; transition: all 0.15s;
    font-family: 'Cormorant Garamond', serif;
    padding: 0.35rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 1px; color: var(--text2);
    background: var(--bg2);
  }
  .tag-cloud-item:hover {
    border-color: var(--accent2); color: var(--accent3);
    background: rgba(155,35,53,0.1);
  }

  /* ── Import/Export modal ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2); border: 1px solid var(--border);
    width: 90%; max-width: 500px;
    padding: 2rem;
  }
  .modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem; font-weight: 300; color: var(--gold);
    margin-bottom: 1.25rem;
  }
  .modal p { color: var(--text2); font-size: 0.92rem; margin-bottom: 1.25rem; }
  .modal-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex; gap: 2rem;
    padding: 0.75rem 0 1.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }
  .stat { display: flex; flex-direction: column; gap: 0.15rem; }
  .stat-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 300; color: var(--gold);
    line-height: 1;
  }
  .stat-label {
    font-family: 'Inconsolata', monospace;
    font-size: 0.65rem; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--text3);
  }

  /* ── Confirmation toast ── */
  #toast {
    position: fixed; bottom: 2rem; right: 2rem;
    background: var(--bg3); border: 1px solid var(--border);
    border-left: 3px solid var(--accent2);
    padding: 0.75rem 1.25rem;
    font-family: 'Inconsolata', monospace; font-size: 0.8rem;
    color: var(--text); z-index: 300;
    transform: translateX(120%); transition: transform 0.3s ease;
    max-width: 320px;
  }
  #toast.show { transform: translateX(0); }

  /* ── Rating stars ── */
  .stars { display: flex; gap: 2px; cursor: pointer; }
  .star { color: var(--border); font-size: 1rem; transition: color 0.1s; }
  .star.lit { color: var(--gold); }
  .star:hover ~ .star { color: var(--border) !important; }
  .stars:hover .star { color: var(--gold2); }

  /* ── Author page ── */
  #view-author { display: none; }
  .author-header {
    margin-bottom: 2rem; padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .author-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.5rem; font-weight: 300;
    color: var(--gold); font-style: italic;
    margin-bottom: 0.25rem;
  }
  .author-subtitle { color: var(--text3); font-size: 0.9rem; }

  /* Responsive */
  @media (max-width: 768px) {
    #sidebar { display: none; }
    #content { padding: 1.25rem; }
    .form-grid { grid-template-columns: 1fr; }
    .stats-bar { gap: 1rem; flex-wrap: wrap; }
    .reader-body-wrapper.light-mode { padding: 1.5rem; }
  }

  /* ── Decorative ornament ── */
  .ornament {
    text-align: center; color: var(--border);
    font-size: 1.2rem; padding: 2rem 0;
    letter-spacing: 0.5em;
  }

  /* Search highlight */
  mark {
    background: rgba(196,81,106,0.25);
    color: var(--accent3); border-radius: 1px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <div id="logo" onclick="showView('library')">The <span>Private</span> Library</div>
    <div id="header-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search titles, authors, tags…" oninput="handleSearch(this.value)">
    </div>
    <div id="header-actions">
      <button class="hbtn hbtn-ghost" onclick="showModal('io-modal')">Import / Export</button>
      <button class="hbtn hbtn-solid" onclick="openEditor()">+ Add Story</button>
    </div>
  </header>

  <div id="main">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Browse</div>
        <div class="sidebar-item active" id="nav-all" onclick="filterCategory(null)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          All Stories
          <span class="sidebar-count" id="count-all">0</span>
        </div>
        <div class="sidebar-item" id="nav-favs" onclick="filterFavorites()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Favorites
          <span class="sidebar-count" id="count-favs">0</span>
        </div>
        <div class="sidebar-item" id="nav-unread" onclick="filterUnread()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          Unread
          <span class="sidebar-count" id="count-unread">0</span>
        </div>
        <div class="sidebar-item" id="nav-tags" onclick="showView('tags')">

          Tag Cloud

    <div id="content">

      <div id="view-library">

              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>

          <div class="form-group full">
            <label class="form-label">Story Content</label>

          <button class="btn btn-primary" onclick="saveStory()">Save Story</button>
          <button class="btn btn-secondary" onclick="showView('library')">Cancel</button>
        </div>

      <!-- Tag Cloud View -->
      <div id="view-tags">
        <div class="library-header">
          <h1 class="library-title">Tag Cloud</h1>
        </div>
        <div class="tag-cloud" id="tag-cloud"></div>
      </div>

      <!-- Author View -->
      <div id="view-author">
        <div class="reader-nav">
          <button class="back-btn" onclick="showView('library')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Library
          </button>
        </div>
        <div class="author-header">
          <div class="author-name" id="author-name"></div>
          <div class="author-subtitle" id="author-subtitle"></div>

        <div class="story-grid" id="author-grid"></div>

    </div><!-- /content -->
  </div><!-- /main -->
</div><!-- /app -->

<!-- Import/Export Modal -->
<div class="modal-overlay" id="io-modal">
  <div class="modal">
    <h2>Import / Export</h2>
    <p>Export all your stories as a JSON file for backup or transfer. Import a previously exported file to restore or merge stories.</p>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="exportData()">Export JSON</button>
      <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">Import JSON</button>
      <button class="btn btn-secondary" onclick="closeModal('io-modal')">Close</button>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)">
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ─────────────────────────────────────────────
//  DATA LAYER
// ─────────────────────────────────────────────
const STORAGE_KEY = 'private_library_v1';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveData(stories) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(stories));
}

function countWords(text) {
  return text.trim().split(/\s+/).filter(Boolean).length;
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function formatDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

function formatWC(n) {
  if (n >= 1000) return (n/1000).toFixed(1) + 'k words';
  return n + ' words';
}

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let state = {
  view: 'library',
  stories: loadData(),
  currentStory: null,
  editingId: null,
  filterCategory: null,
  filterTag: null,
  filterMode: 'all', // 'all' | 'favs' | 'unread'
  searchQuery: '',
  sortBy: 'date-desc',
  readerFontSize: 3,
  readerLightMode: false,
};

// Add sample stories if library is empty
if (state.stories.length === 0) {
  state.stories = [
    {
      id: generateId(),
      title: 'The Midnight Garden',
      author: 'Elara Voss',
      summary: 'A solitary botanist discovers a secret garden that blooms only at midnight, tended by a mysterious stranger whose presence awakens desires she had long suppressed.',
      content: 'The gate was unlocked, as it always was after eleven.\n\nMiranda told herself she came for the roses — the rare black damasks that only opened in moonlight, their scent a narcotic she had documented but never quite explained in any journal. She was a scientist. She believed in explanations.\n\nBut it was not the roses she watched for, crouching between the yew hedges with her notebook pressed against her thigh.\n\nHe appeared, as he always did, at the stroke of midnight.\n\nShe had not learned his name. She had not asked. Asking would have shattered something, the way asking the name of a dream makes the dream dissolve. He moved through the garden as if he owned it — or as if it owned him, which was perhaps more accurate — bending to check this vine, pressing his thumb to that petal, murmuring something low that she could never quite hear.\n\nTonight she had come closer.\n\nHer heartbeat was a problem. She noted it clinically: elevated, arrhythmic, probably 95 BPM. She was thirty-four years old and had not felt this particular calibration of her own pulse since she was nineteen.\n\n"You can come out," he said, without turning.\n\nMiranda stood.\n\nHe turned then, and the moonlight found the angle of his jaw, the hollow of his throat, the slow expansion of his smile. "I wondered when you would."',
      tags: ['slow burn', 'garden', 'mystery', 'sensual'],
      category: 'Romance',
      dateAdded: new Date(Date.now() - 86400000 * 5).toISOString(),
      dateUpdated: new Date(Date.now() - 86400000 * 5).toISOString(),
      wordCount: 0,
      isFavorite: true,
      rating: 4,
      readingProgress: 0.6,
    },
    {
      id: generateId(),
      title: 'Terms & Conditions',
      author: 'J. Mercer',
      summary: 'A high-powered attorney meets her match in an opposing counsel whose negotiation tactics extend well beyond the boardroom.',
      content: 'Rule one of opposing counsel: never let them see you sweat.\n\nCassidy had observed this rule without exception for eleven years. She had argued before appellate judges with a migraine. She had cross-examined a lying CFO while her ex-husband sat in the gallery. She had once won a preliminary injunction with a broken heel and a blood blister the size of a quarter.\n\nNone of that had prepared her for Daniel Ashworth.\n\nHe was already seated when she entered the conference room — which was a small power move she noted and filed away. Seated, relaxed, jacket over the chair, sleeves rolled exactly twice. Reading her brief, which he had somehow obtained two hours before it was submitted.\n\n"Cassidy Reeves," he said, not looking up. "Your argument in the Holloway matter was elegant. The estoppel angle. I didn\'t see it coming."\n\n"I know you didn\'t."\n\nNow he looked up. The eyes were the problem. She had been warned about the eyes by opposing counsel and by at least one partner who had lowered her voice to say it, as though admitting a weather condition one had no business admitting.\n\n"Shall we begin?" she said.\n\n"We already have," said Ashworth.\n\nShe sat down. She opened her folder. She reminded herself of rule one.\n\nIt did not help.',
      tags: ['enemies to lovers', 'professional', 'tension'],
      category: 'Contemporary',
      dateAdded: new Date(Date.now() - 86400000 * 2).toISOString(),
      dateUpdated: new Date(Date.now() - 86400000 * 2).toISOString(),
      wordCount: 0,
      isFavorite: false,
      rating: 5,
      readingProgress: 0,
    },
    {
      id: generateId(),
      title: 'The Cartographer\'s Apprentice',
      author: 'Selin Kara',
      summary: 'In a city where maps are forbidden, an apprentice cartographer hides her work beneath her skirts — until the map-hunter assigned to find her turns out to want much more than parchment.',
      content: 'The city of Veln had two crimes punishable by fire: heresy and cartography.\n\nNadia had committed one of them every day for three years.\n\nHer maps were small. That was the discipline: scale everything down to what could be hidden in the lining of a coat, the hollow of a bread roll, the false bottom of an inkwell. She worked at night by the light of a single candle, drawing from memory the streets that the Censors had ordered to be forgotten. Streets that had housed the wrong people. Streets that led to the wrong ideas.\n\nIf you cannot show them on a map, the First Censor had written, they will not exist in the minds of citizens.\n\nNadia disagreed.\n\nShe was folding the newest sheet — the neighborhood of the papermakers, twelve blocks erased last winter — when she heard the step on the stair.\n\nNot her landlady. Too deliberate.\n\nShe had the map in her bodice in two seconds and the candle out in three and was sitting in the dark with a calmness she did not feel when the door opened.\n\nA lamp. A face she recognized from the broadsheets.\n\n"Cartographer," said the map-hunter, "I\'ve been looking for you for six months."\n\nNadia met his eyes in the dark and said, very quietly: "I know."',
      tags: ['historical', 'forbidden', 'slow burn', 'political'],
      category: 'Historical',
      dateAdded: new Date(Date.now() - 86400000 * 10).toISOString(),
      dateUpdated: new Date(Date.now() - 86400000 * 10).toISOString(),
      wordCount: 0,
      isFavorite: false,
      rating: 0,
      readingProgress: 1.0,
    }
  ];
  state.stories.forEach(s => s.wordCount = countWords(s.content));
  saveData(state.stories);
}

// ─────────────────────────────────────────────
//  VIEW MANAGEMENT
// ─────────────────────────────────────────────
const views = ['library','reader','editor','tags','author'];

function showView(name) {
  views.forEach(v => {
    document.getElementById('view-' + v).style.display = (v === name) ? '' : 'none';
  });
  state.view = name;
  updateSidebar();
  if (name === 'library') renderLibrary();
  if (name === 'tags') renderTagCloud();
}

// ─────────────────────────────────────────────
//  LIBRARY RENDER
// ─────────────────────────────────────────────
function getFilteredStories() {
  let s = [...state.stories];

  if (state.filterMode === 'favs') s = s.filter(x => x.isFavorite);
  else if (state.filterMode === 'unread') s = s.filter(x => !x.readingProgress || x.readingProgress < 0.05);

  if (state.filterCategory) s = s.filter(x => x.category === state.filterCategory);
  if (state.filterTag) s = s.filter(x => x.tags && x.tags.includes(state.filterTag));

  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    s = s.filter(x =>
      x.title.toLowerCase().includes(q) ||
      (x.author || '').toLowerCase().includes(q) ||
      (x.summary || '').toLowerCase().includes(q) ||
      (x.tags || []).some(t => t.toLowerCase().includes(q))
    );
  }

  const sort = state.sortBy;
  s.sort((a,b) => {
    if (sort === 'date-desc') return new Date(b.dateAdded) - new Date(a.dateAdded);
    if (sort === 'date-asc') return new Date(a.dateAdded) - new Date(b.dateAdded);
    if (sort === 'title-asc') return a.title.localeCompare(b.title);
    if (sort === 'alpha-author') return (a.author||'').localeCompare(b.author||'');
    if (sort === 'wc-desc') return b.wordCount - a.wordCount;
    if (sort === 'wc-asc') return a.wordCount - b.wordCount;
    return 0;
  });
  return s;
}

function renderLibrary() {
  const stories = getFilteredStories();
  const grid = document.getElementById('story-grid');
  const ornament = document.getElementById('ornament');

  // Title
  let title = 'All Stories';
  if (state.filterMode === 'favs') title = 'Favorites';
  else if (state.filterMode === 'unread') title = 'Unread';
  else if (state.filterCategory) title = state.filterCategory;
  else if (state.filterTag) title = `#${state.filterTag}`;
  if (state.searchQuery) title = `Search: "${state.searchQuery}"`;
  document.getElementById('library-title').textContent = title;
  document.getElementById('library-subtitle').textContent = stories.length + (stories.length === 1 ? ' story' : ' stories');

  // Stats bar
  const totalWC = state.stories.reduce((s,x) => s + (x.wordCount||0), 0);
  const favCount = state.stories.filter(x => x.isFavorite).length;
  const cats = new Set(state.stories.map(x => x.category).filter(Boolean));
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><div class="stat-value">${state.stories.length}</div><div class="stat-label">Stories</div></div>
    <div class="stat"><div class="stat-value">${Math.round(totalWC/1000)}k</div><div class="stat-label">Total Words</div></div>
    <div class="stat"><div class="stat-value">${favCount}</div><div class="stat-label">Favorites</div></div>
    <div class="stat"><div class="stat-value">${cats.size}</div><div class="stat-label">Categories</div></div>
  `;

  // Render active filters
  renderActiveFilters();

  if (stories.length === 0) {
    grid.innerHTML = '';
    ornament.style.display = 'none';
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <h3>No stories found</h3>
      <p>Add your first story or adjust the filters.</p>
    </div>`;
    return;
  }

  grid.innerHTML = stories.map(s => storyCard(s)).join('');
  ornament.style.display = 'block';
}

function highlight(text, query) {
  if (!query) return escHtml(text);
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return escHtml(text).replace(re, '<mark>$1</mark>');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function storyCard(s) {
  const q = state.searchQuery;
  const stars = s.rating ? '★'.repeat(s.rating) + '☆'.repeat(5 - s.rating) : '';
  const progress = (s.readingProgress || 0) * 100;
  const tags = (s.tags || []).slice(0, 4).map(t =>
    `<span class="card-tag" onclick="filterByTag('${escHtml(t)}',event)">${highlight(t, q)}</span>`
  ).join('');
  return `<div class="story-card" onclick="openStory('${s.id}')">
    <div class="card-category">${escHtml(s.category || 'Uncategorized')}</div>
    <div class="card-title">${highlight(s.title, q)}</div>
    <div class="card-author" onclick="openAuthor('${escHtml(s.author || '')}',event)">${highlight(s.author || 'Unknown', q)}</div>
    <div class="card-summary">${highlight(s.summary || '', q)}</div>
    <div class="card-tags">${tags}</div>
    <div class="card-footer" style="margin-top:0.6rem">
      <span class="card-wc">${formatWC(s.wordCount || 0)}</span>
      <span style="color:var(--gold);font-size:0.75rem">${stars}</span>
      <button class="card-fav ${s.isFavorite ? 'active' : ''}" onclick="toggleFav('${s.id}',event)" title="Favorite">★</button>
    </div>
    ${progress > 0 ? `<div class="card-progress"><div class="card-progress-fill" style="width:${progress}%"></div></div>` : ''}
  </div>`;
}

function renderActiveFilters() {
  const el = document.getElementById('active-filters');
  const filters = [];
  if (state.filterTag) filters.push(`<span class="filter-tag active">#${escHtml(state.filterTag)} <span class="remove" onclick="clearTag()">×</span></span>`);
  el.innerHTML = filters.join('');
}

// ─────────────────────────────────────────────
//  SIDEBAR
// ─────────────────────────────────────────────
function updateSidebar() {
  const cats = {};
  state.stories.forEach(s => {
    if (s.category) cats[s.category] = (cats[s.category] || 0) + 1;
  });

  const el = document.getElementById('sidebar-categories');
  el.innerHTML = '<div class="sidebar-label">Categories</div>';
  Object.entries(cats).sort().forEach(([cat, count]) => {
    const active = state.filterCategory === cat ? 'active' : '';
    el.innerHTML += `<div class="sidebar-item ${active}" onclick="filterCategory('${escHtml(cat)}')">${escHtml(cat)}<span class="sidebar-count">${count}</span></div>`;
  });

  document.getElementById('count-all').textContent = state.stories.length;
  document.getElementById('count-favs').textContent = state.stories.filter(s => s.isFavorite).length;
  const unread = state.stories.filter(s => !s.readingProgress || s.readingProgress < 0.05).length;
  document.getElementById('count-unread').textContent = unread;

  ['nav-all','nav-favs','nav-unread','nav-tags'].forEach(id => {
    document.getElementById(id).classList.remove('active');
  });
  if (state.view === 'tags') document.getElementById('nav-tags').classList.add('active');
  else if (state.filterMode === 'favs') document.getElementById('nav-favs').classList.add('active');
  else if (state.filterMode === 'unread') document.getElementById('nav-unread').classList.add('active');
  else if (!state.filterCategory) document.getElementById('nav-all').classList.add('active');
}

// ─────────────────────────────────────────────
//  FILTERS
// ─────────────────────────────────────────────
function filterCategory(cat) {
  state.filterCategory = cat;
  state.filterTag = null;
  state.filterMode = 'all';
  state.searchQuery = '';
  document.getElementById('search-input').value = '';
  showView('library');
}

function filterFavorites() {
  state.filterMode = 'favs';
  state.filterCategory = null;
  state.filterTag = null;
  showView('library');
}

function filterUnread() {
  state.filterMode = 'unread';
  state.filterCategory = null;
  state.filterTag = null;
  showView('library');
}

function filterByTag(tag, e) {
  if (e) e.stopPropagation();
  state.filterTag = tag;
  state.filterCategory = null;
  state.filterMode = 'all';
  showView('library');
}

function clearTag() {
  state.filterTag = null;
  renderLibrary();
}

function handleSearch(q) {
  state.searchQuery = q.trim();
  if (state.view !== 'library') showView('library');
  else renderLibrary();
}

function handleSort(v) {
  state.sortBy = v;
  renderLibrary();
}

// ─────────────────────────────────────────────
//  READER
// ─────────────────────────────────────────────
function openStory(id) {
  const s = state.stories.find(x => x.id === id);
  if (!s) return;
  state.currentStory = s;

  document.getElementById('reader-category').textContent = s.category || '';
  document.getElementById('reader-title').textContent = s.title;
  document.getElementById('reader-author').innerHTML = `by <span style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted" onclick="openAuthor('${escHtml(s.author||'')}',event)">${escHtml(s.author || 'Unknown')}</span>`;
  document.getElementById('reader-wc').textContent = formatWC(s.wordCount || 0);
  document.getElementById('reader-date').textContent = formatDate(s.dateAdded);
  document.getElementById('reader-tags').innerHTML = (s.tags || []).map(t =>
    `<span class="card-tag" style="cursor:pointer" onclick="filterByTag('${escHtml(t)}',event)">#${escHtml(t)}</span>`
  ).join('');

  // Stars
  renderReaderStars(s.rating || 0, s.id);

  document.getElementById('reader-body').textContent = s.content || '';
  applyFontSize();

  showView('reader');

  // Track reading progress on scroll
  const wrapper = document.getElementById('reader-body-wrapper');
  wrapper.parentElement.addEventListener('scroll', () => trackProgress(s.id), { passive: true });
  window.addEventListener('scroll', () => trackProgress(s.id), { passive: true });
}

function renderReaderStars(current, storyId) {
  const el = document.getElementById('reader-stars');
  el.innerHTML = [1,2,3,4,5].map(n =>
    `<span class="star ${n <= current ? 'lit' : ''}" onclick="setRating('${storyId}',${n})" title="${n} star">${n <= current ? '★' : '☆'}</span>`
  ).join('');
}

function setRating(id, n) {
  const s = state.stories.find(x => x.id === id);
  if (!s) return;
  s.rating = s.rating === n ? 0 : n;
  saveData(state.stories);
  renderReaderStars(s.rating, id);
}

function trackProgress(id) {
  const body = document.getElementById('reader-body');
  if (!body) return;
  const rect = body.getBoundingClientRect();
  const visible = Math.min(window.innerHeight, rect.bottom) - Math.max(0, rect.top);
  const progress = Math.max(0, Math.min(1, (window.scrollY - rect.top + window.innerHeight) / body.offsetHeight));
  const s = state.stories.find(x => x.id === id);
  if (s) {
    s.readingProgress = Math.max(s.readingProgress || 0, progress);
    saveData(state.stories);
  }
}

function changeFontSize(delta) {
  state.readerFontSize = Math.max(1, Math.min(5, state.readerFontSize + delta));
  applyFontSize();
}

function applyFontSize() {
  const w = document.getElementById('reader-body-wrapper');
  [1,2,3,4,5].forEach(n => w.classList.remove('reader-font-s'+n));
  w.classList.add('reader-font-s' + state.readerFontSize);
}

function toggleReadingMode() {
  state.readerLightMode = !state.readerLightMode;
  document.getElementById('reader-body-wrapper').classList.toggle('light-mode', state.readerLightMode);
  document.getElementById('mode-btn').textContent = state.readerLightMode ? '🌙 Dark' : '☀ Light';
}

function editCurrentStory() {
  if (state.currentStory) openEditor(state.currentStory.id);
}

// ─────────────────────────────────────────────
//  EDITOR
// ─────────────────────────────────────────────
function openEditor(id) {
  const s = id ? state.stories.find(x => x.id === id) : null;
  state.editingId = s ? s.id : null;

  document.getElementById('editor-title-text').textContent = s ? 'Edit Story' : 'Add New Story';
  document.getElementById('editor-delete-btn').style.display = s ? '' : 'none';

  document.getElementById('f-title').value = s ? s.title : '';
  document.getElementById('f-author').value = s ? (s.author || '') : '';
  document.getElementById('f-category').value = s ? (s.category || '') : '';
  document.getElementById('f-summary').value = s ? (s.summary || '') : '';
  document.getElementById('f-tags').value = s ? (s.tags || []).join(', ') : '';
  document.getElementById('content-textarea').value = s ? (s.content || '') : '';

  showView('editor');
}

function saveStory() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { toast('Please enter a title.'); return; }

  const content = document.getElementById('content-textarea').value;
  const tags = document.getElementById('f-tags').value
    .split(',').map(t => t.trim().toLowerCase()).filter(Boolean);

  if (state.editingId) {
    const s = state.stories.find(x => x.id === state.editingId);
    if (s) {
      s.title = title;
      s.author = document.getElementById('f-author').value.trim();
      s.category = document.getElementById('f-category').value;
      s.summary = document.getElementById('f-summary').value.trim();
      s.tags = tags;
      s.content = content;
      s.wordCount = countWords(content);
      s.dateUpdated = new Date().toISOString();
    }
    toast('Story updated.');
  } else {
    const now = new Date().toISOString();
    state.stories.unshift({
      id: generateId(),
      title,
      author: document.getElementById('f-author').value.trim(),
      category: document.getElementById('f-category').value,
      summary: document.getElementById('f-summary').value.trim(),
      tags,
      content,
      wordCount: countWords(content),
      dateAdded: now,
      dateUpdated: now,
      isFavorite: false,
      rating: 0,
      readingProgress: 0,
    });
    toast('Story added to library.');
  }
  saveData(state.stories);
  showView('library');
}

function deleteCurrentStory() {
  if (!state.editingId) return;
  if (!confirm('Delete this story permanently?')) return;
  state.stories = state.stories.filter(x => x.id !== state.editingId);
  saveData(state.stories);
  state.editingId = null;
  toast('Story deleted.');
  showView('library');
}

// ─────────────────────────────────────────────
//  FAVORITES
// ─────────────────────────────────────────────
function toggleFav(id, e) {
  if (e) e.stopPropagation();
  const s = state.stories.find(x => x.id === id);
  if (!s) return;
  s.isFavorite = !s.isFavorite;
  saveData(state.stories);
  renderLibrary();
}

// ─────────────────────────────────────────────
//  AUTHOR VIEW
// ─────────────────────────────────────────────
function openAuthor(name, e) {
  if (e) e.stopPropagation();
  if (!name) return;
  const stories = state.stories.filter(s => s.author === name);
  document.getElementById('author-name').textContent = name;
  document.getElementById('author-subtitle').textContent = `${stories.length} ${stories.length === 1 ? 'story' : 'stories'} in the library`;
  document.getElementById('author-grid').innerHTML = stories.map(s => storyCard(s)).join('');
  showView('author');
}

// ─────────────────────────────────────────────
//  TAG CLOUD
// ─────────────────────────────────────────────
function renderTagCloud() {
  const tagCount = {};
  state.stories.forEach(s => (s.tags||[]).forEach(t => tagCount[t] = (tagCount[t]||0)+1));
  const sorted = Object.entries(tagCount).sort((a,b) => b[1]-a[1]);
  const max = sorted[0] ? sorted[0][1] : 1;

  document.getElementById('tag-cloud').innerHTML = sorted.map(([tag, count]) => {
    const size = 0.85 + (count / max) * 1.4;
    return `<span class="tag-cloud-item" style="font-size:${size}rem" onclick="filterByTag('${escHtml(tag)}',event)">#${escHtml(tag)} <small style="opacity:0.5">${count}</small></span>`;
  }).join('');
}

// ─────────────────────────────────────────────
//  IMPORT / EXPORT
// ─────────────────────────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify(state.stories, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `private-library-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('Export complete.');
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error('Invalid format');
      // Merge: add if id not present
      let added = 0;
      imported.forEach(s => {
        if (!state.stories.find(x => x.id === s.id)) {
          if (!s.wordCount) s.wordCount = countWords(s.content || '');
          state.stories.push(s);
          added++;
        }
      });
      saveData(state.stories);
      closeModal('io-modal');
      toast(`Imported ${added} new stories.`);
      renderLibrary();
      updateSidebar();
    } catch {
      toast('Import failed: invalid file.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ─────────────────────────────────────────────
//  MODAL
// ─────────────────────────────────────────────
function showModal(id) {
  document.getElementById(id).classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); });
});

// ─────────────────────────────────────────────
//  TOAST
// ─────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ─────────────────────────────────────────────
//  KEYBOARD
// ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
    if (state.view === 'reader' || state.view === 'editor' || state.view === 'author') showView('library');
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
    e.preventDefault(); openEditor();
  }
});

// ─────────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────────
showView('library');
updateSidebar();
</script>
</body>
</html>
